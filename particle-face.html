<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Particle Face Effect</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
// ===== 설정값 =====
const IMAGE_SRC = "Face.jpg";   // 사진 파일명
const DISPLAY_WIDTH = 500;      // 화면에 보이는 가로 크기(px)
const GRID = 6;                 // 입자 간격(px). 작을수록 촘촘 (4~8 권장)
const RADIUS = 20;              // 마우스 반응 반경(px) — 이제 실제 화면 px 기준
const STRENGTH = 20;            // 밀려나는 힘
const RETURN_SPEED = 0.08;      // 복귀 속도
const MODE = "ascii";           // "dots" 또는 "ascii"
const ASCII_CHARS = " .:-=+*#%@";
const INVERT = false;           // true로 하면 밝은 곳이 진하게 나옴
// ===================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const mouse = { x: -9999, y: -9999 };
let particles = [];
let W, H;

const img = new Image();
img.src = IMAGE_SRC;
img.onload = init;

function init() {
  const dpr = window.devicePixelRatio || 1;
  W = DISPLAY_WIDTH;
  H = Math.round(DISPLAY_WIDTH * (img.height / img.width));

  // 렌더링 해상도는 dpr만큼 올리고 CSS 크기는 고정 → 선명하게 + 마우스 좌표 1:1
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.scale(dpr, dpr);

  const off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  const offCtx = off.getContext('2d');
  offCtx.drawImage(img, 0, 0, W, H);
  const data = offCtx.getImageData(0, 0, W, H).data;

  particles = [];
  for (let y = 0; y < H; y += GRID) {
    for (let x = 0; x < W; x += GRID) {
      const i = (y * W + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
      if (a < 50) continue;
      let brightness = (r + g + b) / 3 / 255;
      if (INVERT) brightness = 1 - brightness;
      particles.push({ ox: x, oy: y, x: x, y: y, brightness });
    }
  }
  requestAnimationFrame(loop);
}

function loop() {
  ctx.clearRect(0, 0, W, H);

  for (const p of particles) {
    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < RADIUS) {
      const angle = Math.atan2(dy, dx);
      const force = (RADIUS - dist) / RADIUS;
      p.x += Math.cos(angle) * force * STRENGTH;
      p.y += Math.sin(angle) * force * STRENGTH;
    } else {
      p.x += (p.ox - p.x) * RETURN_SPEED;
      p.y += (p.oy - p.y) * RETURN_SPEED;
    }

    const alpha = 1 - p.brightness;
    if (alpha < 0.03) continue;

    if (MODE === "ascii") {
      const charIndex = Math.floor((1 - p.brightness) * (ASCII_CHARS.length - 1));
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.font = `${GRID + 2}px monospace`;
      ctx.textBaseline = "middle";
      ctx.fillText(ASCII_CHARS[charIndex], p.x, p.y);
    } else {
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, GRID / 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mouseleave', () => {
  mouse.x = -9999;
  mouse.y = -9999;
});
</script>

</body>
</html>
