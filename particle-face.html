<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Steffi</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const IMAGE_SRC = "Face.jpg";

/* ===== EFFECT SETTINGS ===== */

const GRID = 4;

/* 커서가 영향을 주는 범위 */
const RADIUS = 35;

/* 입자가 밀려나는 정도 */
const STRENGTH = 45;

/* 원래 위치로 돌아오는 속도 */
const RETURN_SPEED = 0.06;

/* 입자 크기 */
const PARTICLE_SIZE = 1.2;

/* ============================ */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const mouse = {
  x: -9999,
  y: -9999
};

let particles = [];

const image = new Image();

image.src = IMAGE_SRC;

image.onload = function () {
  createParticles();
  animate();
};


function createParticles() {

  const width = image.width;
  const height = image.height;

  canvas.width = width;
  canvas.height = height;

  const offscreen = document.createElement("canvas");

  offscreen.width = width;
  offscreen.height = height;

  const offCtx = offscreen.getContext("2d");

  offCtx.drawImage(
    image,
    0,
    0,
    width,
    height
  );

  const imageData =
    offCtx.getImageData(
      0,
      0,
      width,
      height
    ).data;

  particles = [];

  for (
    let y = 0;
    y < height;
    y += GRID
  ) {

    for (
      let x = 0;
      x < width;
      x += GRID
    ) {

      const index =
        (y * width + x) * 4;

      const r = imageData[index];
      const g = imageData[index + 1];
      const b = imageData[index + 2];

      const brightness =
        (r + g + b) / 3;

      /*
        사진의 밝기를 기준으로
        흰색~검정 입자를 생성
      */

      particles.push({

        originalX: x,
        originalY: y,

        x: x,
        y: y,

        brightness: brightness

      });

    }

  }

}


function animate() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  for (const particle of particles) {

    /*
      마우스와 입자의 거리
    */

    const dx =
      particle.x - mouse.x;

    const dy =
      particle.y - mouse.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    /*
      마우스 근처라면
      입자를 밀어냄
    */

    if (distance < RADIUS) {

      const angle =
        Math.atan2(dy, dx);

      const force =
        (RADIUS - distance) /
        RADIUS;

      particle.x +=
        Math.cos(angle) *
        force *
        STRENGTH;

      particle.y +=
        Math.sin(angle) *
        force *
        STRENGTH;

    }


    /*
      마우스에서 멀어지면
      원래 사진 위치로 돌아감
    */

    particle.x +=
      (particle.originalX - particle.x)
      * RETURN_SPEED;

    particle.y +=
      (particle.originalY - particle.y)
      * RETURN_SPEED;


    /*
      밝기에 따라
      입자의 투명도를 결정
    */

    const alpha =
      1 -
      particle.brightness / 255;


    ctx.fillStyle =
      `rgba(0,0,0,${0.25 + alpha * 0.75})`;


    ctx.beginPath();

    ctx.arc(
      particle.x,
      particle.y,
      PARTICLE_SIZE,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

  requestAnimationFrame(animate);

}


/*
  MOUSE
*/

canvas.addEventListener(
  "mousemove",
  function(event) {

    const rect =
      canvas.getBoundingClientRect();

    const scaleX =
      canvas.width / rect.width;

    const scaleY =
      canvas.height / rect.height;

    mouse.x =
      (event.clientX - rect.left)
      * scaleX;

    mouse.y =
      (event.clientY - rect.top)
      * scaleY;

  }
);


canvas.addEventListener(
  "mouseleave",
  function() {

    mouse.x = -9999;
    mouse.y = -9999;

  }
);


/*
  TOUCH
*/

canvas.addEventListener(
  "touchmove",
  function(event) {

    const touch =
      event.touches[0];

    const rect =
      canvas.getBoundingClientRect();

    const scaleX =
      canvas.width / rect.width;

    const scaleY =
      canvas.height / rect.height;

    mouse.x =
      (touch.clientX - rect.left)
      * scaleX;

    mouse.y =
      (touch.clientY - rect.top)
      * scaleY;

  },
  { passive: true }
);


canvas.addEventListener(
  "touchend",
  function() {

    mouse.x = -9999;
    mouse.y = -9999;

  }
);

</script>

</body>
</html>
