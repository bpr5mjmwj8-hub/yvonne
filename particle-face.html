<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Particle Face Effect</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
// ===== 설정값 =====
const IMAGE_SRC = "Face.jpg";
const DISPLAY_WIDTH = 300;
const GRID = 6;
const RADIUS = 40;
const STRENGTH = 1.4;
const SPRING = 0.06;
const FRICTION = 0.85;
const MODE = "ascii";
const ASCII_CHARS = " .:-=+*#%@";
const INVERT = false;
const JITTER = GRID * 0.4;   // 추가됨: 위치 불규칙하게 흔드는 정도
// ===================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const mouse = { x: -9999, y: -9999 };
let particles = [];
let W, H;

const img = new Image();
img.src = IMAGE_SRC;
img.onload = init;

function init() {
  const dpr = window.devicePixelRatio || 1;
  W = DISPLAY_WIDTH;
  H = Math.round(DISPLAY_WIDTH * (img.height / img.width));

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.scale(dpr, dpr);

  const off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  const offCtx = off.getContext('2d');
  offCtx.drawImage(img, 0, 0, W, H);
  const data = offCtx.getImageData(0, 0, W, H).data;

  particles = [];
  for (let y = 0; y < H; y += GRID) {
    for (let x = 0; x < W; x += GRID) {
      const i = (y * W + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
      if (a < 50) continue;
      let brightness = (r + g + b) / 3 / 255;
      if (INVERT) brightness = 1 - brightness;

      // 추가됨: 위치를 살짝 랜덤하게 흔들기
      const jx = x + (Math.random() - 0.5) * JITTER;
      const jy = y + (Math.random() - 0.5) * JITTER;

      particles.push({ ox: jx, oy: jy, x: jx, y: jy, vx: 0, vy: 0, brightness });
    }
  }
  requestAnimationFrame(loop);
}

function loop() {
  ctx.clearRect(0, 0, W, H);

  for (const p of particles) {
    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy) + 0.0001;

    if (dist < RADIUS) {
      const falloff = Math.pow(1 - dist / RADIUS, 2);
      p.vx += (dx / dist) * falloff * STRENGTH;
      p.vy += (dy / dist) * falloff * STRENGTH;
    }

    p.vx += (p.ox - p.x) * SPRING;
    p.vy += (p.oy - p.y) * SPRING;

    p.vx *= FRICTION;
    p.vy *= FRICTION;

    p.x += p.vx;
    p.y += p.vy;

    const alpha = 1 - p.brightness;
    if (alpha < 0.03) continue;

    if (MODE === "ascii") {
      const charIndex = Math.floor((1 - p.brightness) * (ASCII_CHARS.length - 1));
      // 추가됨: 밝기에 따라 글자 크기도 살짝 다르게
      const size = GRID + 2 + p.brightness * 2;
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.font = `${size}px monospace`;
      ctx.textBaseline = "middle";
      ctx.fillText(ASCII_CHARS[charIndex], p.x, p.y);
    } else {
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, GRID / 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mouseleave', () => {
  mouse.x = -9999;
  mouse.y = -9999;
});
</script>

</body>
</html>
