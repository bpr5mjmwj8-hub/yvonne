<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Particle Face Effect</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    max-width: 100%;
    display: block;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
// ===== 설정값 (여기만 바꾸면 됨) =====
const IMAGE_SRC = "Face.jpg";   // 본인 사진 파일명
const GRID = 5;                 // 도트 간격(px). 작을수록 촘촘하고 느려짐 (4~8 권장)
const RADIUS = 60;              // 마우스 반응 반경(px)
const STRENGTH = 25;            // 밀려나는 힘
const RETURN_SPEED = 0.08;      // 복귀 속도 (0~1, 클수록 빠르게 복귀)
const MODE = "dots";            // "dots" 또는 "ascii"
const ASCII_CHARS = ".:-=+*#%@";
// =====================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const mouse = { x: -9999, y: -9999 };
let particles = [];

const img = new Image();
img.src = IMAGE_SRC;
img.onload = init;

function init() {
  const w = img.width;
  const h = img.height;
  canvas.width = w;
  canvas.height = h;

  const off = document.createElement('canvas');
  off.width = w;
  off.height = h;
  const offCtx = off.getContext('2d');
  offCtx.drawImage(img, 0, 0, w, h);
  const data = offCtx.getImageData(0, 0, w, h).data;

  particles = [];
  for (let y = 0; y < h; y += GRID) {
    for (let x = 0; x < w; x += GRID) {
      const i = (y * w + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
      if (a < 50) continue; // 투명 영역 스킵
      const brightness = (r + g + b) / 3 / 255;
      particles.push({
        ox: x, oy: y,
        x: x, y: y,
        color: `rgb(${r},${g},${b})`,
        brightness: brightness
      });
    }
  }
  requestAnimationFrame(loop);
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of particles) {
    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < RADIUS) {
      const angle = Math.atan2(dy, dx);
      const force = (RADIUS - dist) / RADIUS;
      p.x += Math.cos(angle) * force * STRENGTH;
      p.y += Math.sin(angle) * force * STRENGTH;
    } else {
      p.x += (p.ox - p.x) * RETURN_SPEED;
      p.y += (p.oy - p.y) * RETURN_SPEED;
    }

    if (MODE === "ascii") {
      const charIndex = Math.floor(p.brightness * (ASCII_CHARS.length - 1));
      ctx.fillStyle = p.color;
      ctx.font = `${GRID}px monospace`;
      ctx.fillText(ASCII_CHARS[charIndex], p.x, p.y);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, GRID / 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouse.x = (e.clientX - rect.left) * scaleX;
  mouse.y = (e.clientY - rect.top) * scaleY;
});

canvas.addEventListener('mouseleave', () => {
  mouse.x = -9999;
  mouse.y = -9999;
});
</script>

</body>
</html>
